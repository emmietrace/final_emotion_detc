<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Emotion Vortex - by Emmie</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <header>
      <h1>Emotion Vortex</h1>
      <p>Detect emotions with AI-powered precision</p>
      <div class="credit">Created by Emmie</div>
    </header>

    <div class="tabs">
      <button class="tab-btn active" onclick="openTab('upload')">Upload Image</button>
      <button class="tab-btn" onclick="openTab('webcam')">Live Webcam</button>
    </div>

    <!-- Upload Tab -->
    <div id="upload" class="tab-content active">
      <form id="upload-form" enctype="multipart/form-data">
        <input type="text" id="name-upload" placeholder="Your Name" required />
        <div class="file-input">
          <input type="file" id="image" accept="image/*" required />
          <label for="image" id="file-label">Choose Image</label>
        </div>
        <button type="submit" id="analyze-button">Analyze Emotion</button>
      </form>
      <div id="upload-loading" class="loading hidden">Analyzing your image...</div>
    </div>

    <!-- Webcam Tab -->
    <div id="webcam" class="tab-content">
      <input type="text" id="name-webcam" placeholder="Your Name" required />
      <div class="camera-container">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" width="48" height="48" style="display:none;"></canvas>
      </div>
      <button id="capture">Capture & Analyze</button>
      <div id="webcam-loading" class="loading hidden">Processing capture...</div>
    </div>

    <!-- Result -->
    <div id="result" class="result hidden">
      <h2>Detected Emotion</h2>
      <img id="result-img" alt="Captured" />
      <div class="emotion-info">
        <p><strong>Name:</strong> <span id="result-name"></span></p>
        <p><strong>Emotion:</strong> <span id="emotion" class="emotion-tag"></span></p>
        <p><strong>Confidence:</strong> <span id="confidence"></span>%</p>
      </div>
    </div>
  </div>
<script>
  // Tab switching
  function openTab(tabName) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabName).classList.add('active');
    document.querySelector(`button[onclick="openTab('${tabName}')"]`).classList.add('active');
    
    document.getElementById('result').classList.add('hidden');
    
    if (tabName === 'webcam') {
      startWebcam();
    } else {
      stopWebcam();
    }
  }

  // --- FIX 1: Green Tick & Filename ---
  document.getElementById('image').addEventListener('change', function(e) {
    const fileName = e.target.files[0]?.name;
    const label = document.getElementById('file-label');
    
    if (fileName) {
      // Add green tick and filename
      label.innerHTML = `✅ ${fileName}`;
      label.style.border = "2px solid #27ae60"; // Green border hint
      label.style.color = "#fff";
    } else {
      label.textContent = 'Choose Image';
      label.style.border = "none";
    }
  });

  // Upload form logic
  document.getElementById('upload-form').onsubmit = async (e) => {
    e.preventDefault();
    const formData = new FormData();
    const nameInput = document.getElementById('name-upload');
    const imageInput = document.getElementById('image');
    
    if (!nameInput.value.trim() || !imageInput.files[0]) {
      alert('Please fill in all fields');
      return;
    }
    
    formData.append('name', nameInput.value);
    formData.append('image', imageInput.files[0]);

    toggleLoading(true, 'upload');

    try {
      const res = await fetch('/upload', { method: 'POST', body: formData });
      const data = await res.json();
      if (data.emotion) showResult(data, nameInput.value);
      else alert(data.error || 'Detection failed');
    } catch (error) {
      console.error(error);
      alert('An error occurred');
    } finally {
      toggleLoading(false, 'upload');
    }
  };

  // --- FIX 2: High Resolution Webcam ---
  let stream;
  const video = document.getElementById('video');
  
  function startWebcam() {
    if (stream) return;
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } } })
      .then(s => {
        stream = s;
        video.srcObject = s;
      }).catch(err => {
        alert("Camera access denied.");
      });
  }

  function stopWebcam() {
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
  }

  document.getElementById('capture').onclick = async () => {
    const nameInput = document.getElementById('name-webcam');
    if (!nameInput.value.trim() || !stream) {
      alert('Please enter name and allow camera');
      return;
    }

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    // CAPTURE AT FULL RESOLUTION
    // We set canvas size to match the actual video stream size
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    const dataUrl = canvas.toDataURL('image/jpeg', 0.9); // High quality JPG
    
    toggleLoading(true, 'webcam');

    try {
      const res = await fetch('/webcam', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: dataUrl, name: nameInput.value })
      });
      const data = await res.json();
      if (data.emotion) showResult(data, nameInput.value);
      else alert(data.error || 'Detection failed');
    } catch (error) {
      console.error(error);
      alert('Error processing capture');
    } finally {
      toggleLoading(false, 'webcam');
    }
  };

  // Helper to toggle UI states
  function toggleLoading(isLoading, type) {
    const btnId = type === 'upload' ? 'analyze-button' : 'capture';
    const loadId = type === 'upload' ? 'upload-loading' : 'webcam-loading';
    const btn = document.getElementById(btnId);
    
    btn.disabled = isLoading;
    btn.textContent = isLoading ? 'Processing...' : (type === 'upload' ? 'Analyze Emotion' : 'Capture & Analyze');
    
    if (isLoading) {
        document.getElementById(loadId).classList.remove('hidden');
        document.getElementById('result').classList.add('hidden');
    } else {
        document.getElementById(loadId).classList.add('hidden');
    }
  }

  function showResult(data, name) {
    document.getElementById('result').classList.remove('hidden');
    document.getElementById('result-img').src = '/' + data.image_url + '?t=' + Date.now();
    document.getElementById('result-name').textContent = name;
    document.getElementById('emotion').textContent = data.emotion;
    
    // Reset classes and add new emotion class
    const tag = document.getElementById('emotion');
    tag.className = 'emotion-tag ' + data.emotion.toLowerCase();
    
    document.getElementById('confidence').textContent = data.confidence; // Backend handles formatting now
    document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  window.addEventListener('beforeunload', () => stopWebcam());
</script>
</body>
</html>
